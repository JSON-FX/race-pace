<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Race Pace Admin</title>
    <script>
      (function () {
        try {
          // Only an explicit stored choice enables dark. prefers-color-scheme is
          // deliberately ignored until the shadcn migration finishes — screens still
          // on the legacy variables have no dark variant. Must match readTheme() in
          // src/lib/theme.ts; the two disagreeing causes a flash of the wrong theme.
          if (localStorage.getItem("rp-theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
