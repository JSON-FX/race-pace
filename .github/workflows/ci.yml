name: Web and admin CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - 'feature/**'
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-admin-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: web-admin-validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Require staging as the production source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          RELEASE_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$RELEASE_HEAD_REF" != "staging" ]; then
            echo "::error::Production pull requests must promote staging into main."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # This stack and its credentials exist only inside the ephemeral runner.
      # No hosted Supabase or PayMongo secrets are available to this job.
      - name: Start isolated Supabase
        run: pnpm exec supabase start
      - name: Check migration replay and retired job
        run: |
          pnpm exec supabase status -o env > .env.local
          node scripts/ci-assert-local.mjs
      - name: Start fake-provider Edge Functions
        run: |
          cat > /tmp/racepace-ci-functions.env <<'EOF'
          PAYMONGO_WEBHOOK_SECRET=whsec_ci_dummy_only
          TICKET_SIGNING_SECRET=ci-only-signing-secret-never-used-outside-runner
          ADMIN_APP_URL=http://localhost:3001
          EMAIL_PROVIDER=mailpit
          MAILPIT_SMTP_HOST=inbucket
          EOF
          echo 'SUPABASE_FUNCTIONS_ENV_FILE=/tmp/racepace-ci-functions.env' >> "$GITHUB_ENV"
          nohup pnpm exec supabase functions serve --no-verify-jwt --env-file /tmp/racepace-ci-functions.env > /tmp/racepace-ci-edge.log 2>&1 &
          for attempt in {1..30}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54521/functions/v1/expire-paymongo-checkouts || true)
            if [ "$code" = "405" ]; then exit 0; fi
            sleep 2
          done
          cat /tmp/racepace-ci-edge.log
          exit 1
      - name: Typecheck runner and admin
        run: |
          pnpm --filter site typecheck
          pnpm --filter web typecheck
      - name: Test runner and admin
        run: |
          pnpm --filter site test
          pnpm --filter web test
      - name: Test database, functions and shared contracts
        run: pnpm test
      - name: Build runner and admin
        run: |
          set -a
          . ./.env.local
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export NEXT_PUBLIC_SITE_URL=http://localhost:3000
          pnpm --filter site build
          pnpm --filter web build
      - name: Show Edge logs on failure
        if: failure()
        run: tail -100 /tmp/racepace-ci-edge.log 2>/dev/null || true
